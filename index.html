<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <script src="index.js" defer></script>
    <title>Calculator Task</title>
</head>
<body class="bg-[#000] text-[#fff]">
    <h1 class="text-4xl text-center pt-[2rem]">Calculator</h1>

    <section class="text-center rounded-md md:w-[40%] w-full md:mx-auto md:mt-[50px] m-[1rem] p-[20px] bg-[#808080]">
        <div class="my-[1rem] py-[0.5rem] rounded-md bg-[#fff] text-[#000] h-[100px]">
            <span class="block text-right pr-[1rem]" id="topNum"></span>
            <span class="block text-right pt-[1rem] pr-[1rem]" id="answer"></span>
        </div>

        <div class="container">
            <div class="flex gap-[1rem] mb-[1rem]">
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">1</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">2</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">3</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm operator">+</button>
            </div>
    
            <div class="flex gap-[1rem] mb-[1rem]">
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">4</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">5</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">6</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm operator">-</button>
            </div>
    
            <div class="flex gap-[1rem] mb-[1rem]">
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">7</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">8</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">9</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm operator">*</button>
            </div>
    
            <div class="flex gap-[1rem] mb-[1rem]">
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm number">0</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm equal">=</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm clear">C</button>
                <button type="button" class="cursor-pointer bg-[#fff] text-[#000] w-[25%] h-[50px] rounded-sm operator">/</button>
            </div>
        </div>
    </section>
</body>
</html>
